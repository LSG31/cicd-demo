name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cicd-demo:${{ github.sha }} .
      - name: Smoke test container
        run: |
          docker run -d --name app -p 8000:8000 cicd-demo:${{ github.sha }}
          for i in {1..20}; do
            curl --fail http://127.0.0.1:8000/health && exit 0
            sleep 2
          done
          docker logs app
          exit 1
