name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-publish:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" .
          docker push "${{ steps.meta.outputs.image }}"

  deploy-staging:
    needs: build-publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export IMAGE="${{ needs.build-publish.outputs.image }}"
            export ENVIRONMENT="staging"
            export PORT="8000"
            mkdir -p ~/cicd-demo
            cd ~/cicd-demo
            curl -fsSL -o deploy.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/deploy.sh
            chmod +x deploy.sh
            ./deploy.sh

  deploy-production:
    needs: [build-publish, deploy-staging]
    if: github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            export IMAGE="${{ needs.build-publish.outputs.image }}"
            export ENVIRONMENT="production"
            export PORT="8000"
            mkdir -p ~/cicd-demo
            cd ~/cicd-demo
            curl -fsSL -o deploy.sh https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/deploy.sh
            chmod +x deploy.sh
            ./deploy.sh
